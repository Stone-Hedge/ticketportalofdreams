<td class='{% if a %}{% if not a.assigned_to %}state-grey{% elif a.transfer_status == "cancelled" %}state-red{% elif a.transfer_status == "pending" %}state-blue{% elif a.transfer_status == "transferred" and a.payment_status == "paid" %}state-green{% elif a.payment_status == "unpaid" %}state-amber{% else %}state-grey{% endif %}{% else %}state-grey{% endif %}'>{% if a %}<button hx-get='/allocation/{{a.id}}/edit/' hx-target='closest td' hx-swap='outerHTML'>{{ a.assigned_to|default:'Available' }}<br><small>{{a.transfer_status}} / {{a.payment_status}}</small></button>{% else %}N/A{% endif %}</td>
